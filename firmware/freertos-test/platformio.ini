; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino


; Velocidad del puerto serial (para ver los mensajes rápido)
monitor_speed = 115200

; Velocidad de subida del firmware (para no esperar años)
upload_speed = 921600

; 2. Filtros del Monitor 
; send_on_enter: No envía nada hasta que des Enter.
; time: Muestra la hora en cada mensaje (útil para debug).
; colorize: Colores si usas logs con formato.
monitor_filters = 
    send_on_enter
    time
    colorize

; 3. Ver lo que escribo
monitor_echo = yes

; 4. Forzar el salto de línea al enviar
; Esto asegura que cuando des Enter, se envíe \n (LF) o \r\n (CRLF)
monitor_eol = LF